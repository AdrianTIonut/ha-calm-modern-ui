<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calm Modern UI — on a tablet and a phone</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 56px 64px; background: radial-gradient(1200px 700px at 30% 20%, #16233d 0%, #0a0f1a 60%, #070a12 100%); font-family: system-ui, sans-serif; }
  #out { display: flex; align-items: flex-end; justify-content: center; gap: 56px; width: max-content; }
  .dev { background: #05070b; box-shadow: 0 0 0 2px #2a3242, 0 30px 70px rgba(0,0,0,.55), inset 0 0 0 2px #0e131c; position: relative; }
  .tablet { padding: 20px; border-radius: 40px; }
  .phone { padding: 12px; border-radius: 54px; }
  /* the real dashboard (docs/demo/dashboard.html) in an iframe at the real device size, scaled down to fit the frame */
  .scr { overflow: hidden; background: #0b1220; position: relative; }
  .tablet .scr { width: 960px; height: 600px; border-radius: 22px; }
  .phone .scr { width: 292px; height: 633px; border-radius: 42px; }
  .scr iframe { border: 0; position: absolute; left: 0; top: 0; transform-origin: 0 0; transform: scale(.75); background: #0b1220; }
  .tablet iframe { width: 1280px; height: 800px; }
  .phone iframe { width: 390px; height: 844px; }
  .island { position: absolute; top: 10px; left: 50%; width: 76px; height: 22px; margin-left: -38px; border-radius: 20px; background: #000; z-index: 5; }
  .cam { position: absolute; top: 50%; left: 8px; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: #1b2230; }
</style></head>
<body>
<div id="out">
  <div class="dev tablet"><div class="cam"></div><div class="scr"><iframe id="ft" src="dashboard.html?device=tablet&sticky=1"></iframe></div></div>
  <div class="dev phone"><div class="scr"><div class="island"></div><iframe id="fp" src="dashboard.html?device=phone&sticky=1&pad=44"></iframe></div></div>
</div>
<script>
// ready when both embedded dashboards are drawn
const wait = setInterval(() => {
  try { if (['ft', 'fp'].every((i) => document.getElementById(i).contentDocument.title === 'ready')) { clearInterval(wait); setTimeout(() => (document.title = 'ready'), 2500); } } catch (e) { /* still loading */ }
}, 200);
</script>
</body></html>
