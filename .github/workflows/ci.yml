name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tests
        run: node tests/run-all.mjs
      - name: ccu.js must be generated from src/
        run: |
          node build.mjs
          git diff --exit-code ccu.js || (echo "ccu.js is out of date: run 'node build.mjs' and commit it" && exit 1)
