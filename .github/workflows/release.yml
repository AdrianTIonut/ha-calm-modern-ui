name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/run-all.mjs
      - run: node build.mjs
      - name: Pack the fonts (not part of ccu.js; unzip into /config/www/ccu/)
        run: zip -r fonts.zip fonts
      - name: Publish a release with ccu.js attached (HACS / Marketplace downloads it from here) and fonts.zip
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ccu.js
            fonts.zip
          generate_release_notes: true
