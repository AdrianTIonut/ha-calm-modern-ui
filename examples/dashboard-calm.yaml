                label: Energy
                path: /dashboard-calm/energy
              - icon: bolt
                label: Solar
                path: /dashboard-calm/solar
              - icon: bulb
                label: Lights
                path: /dashboard-calm/lights
                badge:
                  - sensor.lights_on
                badge_style: light
              - icon: camera
                label: Cams
                path: /dashboard-calm/cams
                badge:
                  - binary_sensor.cam1_person
